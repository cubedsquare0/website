<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account - Cubed Square</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <nav>
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/store">Store</a></li>
        <li><a href="/news">News</a></li>
        <li><a href="/community">Community</a></li>
        <li><a href="/support">Support</a></li>
        <li><a href="/account">Account</a></li>
        <li><a href="/play">Play</a></li>
        <li><a href="/gallery">Gallery</a></li>
        <li><a href="/about">About</a></li>
      </ul>
    </nav>
  </header>

  <section style="padding-top: 80px;">
    <h1>Account</h1>
    <div id="auth-forms">
      <div id="login-form">
        <h2>Login</h2>
        <form id="login">
          <label for="login-username">Username:</label>
          <input type="text" id="login-username" name="username" required><br>
          <label for="login-password">Password:</label>
          <input type="password" id="login-password" name="password" required><br>
          <button type="submit">Login</button>
        </form>
        <p>Don't have an account? <a href="#" id="show-signup">Sign up</a></p>
      </div>
      <div id="signup-form" style="display: none;">
        <h2>Sign Up</h2>
        <form id="signup">
          <label for="signup-username">Username:</label>
          <input type="text" id="signup-username" name="username" required><br>
          <label for="signup-password">Password:</label>
          <input type="password" id="signup-password" name="password" required><br>
          <button type="submit">Sign Up</button>
        </form>
        <p>Already have an account? <a href="#" id="show-login">Login</a></p>
      </div>
    </div>
    <div id="user-info" style="display: none;">
      <h2>Welcome, <span id="username"></span>!</h2>
      <button id="logout">Logout</button>
    </div>
    <div id="message"></div>
  </section>

  <footer>
    <p>&copy; 2023 Cubed Square. All rights reserved.</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
